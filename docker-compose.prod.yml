version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: taskmanager_db_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - taskmanager_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanager_backend_prod
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      - db
    networks:
      - taskmanager_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmanager_frontend_prod
    restart: always
    depends_on:
      - backend
    networks:
      - taskmanager_network

  nginx:
    image: nginx:alpine
    container_name: taskmanager_nginx_prod
    restart: always
    ports:
      - "80:80"  # Production uses standard port 80
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - taskmanager_network

volumes:
  postgres_data_prod:

networks:
  taskmanager_network:
    driver: bridge
